# ============================================================================
# M6 统一数据出口 —— 响应码补遗 v0.2
# ----------------------------------------------------------------------------
# 本文件是既有契约的**增量**，只做一件事：
# 给 `/v1/geometry/sections/{section_id}/` 子树里的六个端点补上 **404**。
# 真源仍是服务运行后自动生成的 /openapi.json；本文件是它的人工摘要。
#
# ★ 与 v0.1 的关系：v0.1 补的是**契约漏声明**（实现会回、契约没写）。
#   本文件不同 —— 它记录的是**一次行为修正**：那六个端点原先回 **200 空**，
#   现在改成回 **404**，与同一棵子树里另外五个兄弟统一。
#
# ★★★ 为什么必须修正（D-029 量出来的事实）
# ----------------------------------------------------------------------------
# 对同一个不存在的 `section_id`（现场实测 99999）：
#
#   端点                              修正前      修正后
#   -------------------------------  ---------  --------
#   /summary                         404        404   （本来就对）
#   /monitor-sections                404        404   （本来就对）
#   /geo                             404        404   （本来就对）
#   /geo/reverse                     404        404   （本来就对）
#   /geo/route                       404        404   （本来就对）
#   /widths                          **200 空**  404   ← 本文件修正
#   /superelevation                  **200 空**  404   ← 本文件修正
#   /stations                        **200 空**  404   ← 本文件修正
#   /alignment                       **200 空**  404   ← 本文件修正
#   /elements                        **200 空**  404   ← 本文件修正
#   /samples                         **200 空**  404   ← 本文件修正
#
#   ⇒ **五个兄弟回 404、六个兄弟回 200 空。**
#     调用方拿到 200 空，分不出「这个路段没有宽度数据」与「根本没这个路段」。
#     前者是数据缺口（去找源文件），后者是调用错误（去改代码）——
#     两者在下游的处置**完全不同**，而接口把它们说成了同一件事。
#
# ★★ 这条判据在代码里**早就写着两遍**，只是都没管住 section_id：
#
#   · M3 `GeRepository.samples_by_station` 对 `seg` 写着：
#       「空列表会被读成『这段在区间内没有数据』，而实际是『段名写错了』」
#     —— 它对**段名**用了这条判据，对**路段 id** 没有用。
#       同一个判断、同一段话、漏了一半。
#
#   · M6 `app.py` 的 `/monitor-sections` 写着：
#       「不先证明，写错一个 section_id 得到的是『没有数据』，
#         而不是『没有这个路段』—— 这正是本 feature 一路在挡的那类静默错。」
#     —— 它照做了，它的同门没照做。
#
# ★★★ 最刺眼的一条证据：**替身比真身更严。**
#   路由测试里的假仓储 `_FakeGe` 有**五个**方法（stations / alignment / widths /
#   superelevation / completeness）**早就写着 `self.section(section_id)`**，
#   对不存在的路段抛 NotFound。
#
#   ⇒ 于是路由测试**测的是一个真实现并不具备的严格性**：
#     假实现回 404，真实现回 200，而测试**全绿**。
#     假实现"知道"这条规则，真实代码不知道，而没有任何东西在比这两者。
#     ★ 本轮的修正不是"把假实现改松"，而是**让真实现追上它自己的替身**。
#
# ★ 修法：一处判定，六个方法各过一道。
#   M3 `GeRepository._require_section(section_id)` —— 内部就是 `self.section()`。
#   判在 M3 而非 M6，是因为 M6 那层自己写着
#   「本层只做两件事：转发筛选参数、把 M3 的语义化异常翻成 HTTP。SQL 一律在 M3」。
#   判在 M3，**所有调用方**（网关、控制台、以后的 SDK）一并拿到同一条保证；
#   判在 M6，每个新入口都要各自记得再判一次。
#   代价：每次取数多一次主键查询。**故意的** —— 换来的是
#   「这个 section_id 到底存不存在」这个问题**只有一个答案**。
#
# ★ 本文件不含 422：`/stations` 的 422 在 v0.1 里补过。
#   两者不同源 —— 422 是**参数**越界（与 section_id 无关，任何 id 都会这么回），
#   404 是**路段**不存在。参数校验先于函数体，所以
#   `?limit=0` 配一个不存在的路段仍然是 **422**，不是 404。
#
# ★ 版本序（`((major, minor), 文件名)`）：本文件是 (0,2)，
#   与 geo.v0.2 同组，按文件名排在 **geo.v0.2 之后**（g < r）。
# ============================================================================
openapi: 3.0.3
info:
  title: 路面性能数智化平台 — M6 统一数据出口（响应码补遗 v0.2）
  version: 0.2.0
  description: >-
    给 /v1/geometry/sections/{section_id}/ 子树的六个端点补 404，
    与同一子树里另外五个兄弟统一。这是一次**行为修正**，不是补声明。

paths:
  /v1/geometry/sections/{section_id}/widths:
    get:
      summary: 路幅宽度表（`.WID` 的变化点，按桩号）
      responses:
        "404":
          description: >-
            路段不存在。与 /summary、/monitor-sections 同一条判据（D-029）：
            先证明路段存在，再回答"它有没有宽度数据"。
            ★ 「路段不存在」与「该路段存在但没有宽度数据」（200 + 空列表）
              是两回事 —— 返一样的响应，调用方就分不出
              「数据缺口」与「调用错误」。

  /v1/geometry/sections/{section_id}/superelevation:
    get:
      summary: 超高过渡（`.SUP` 的逐桩横坡控制点）
      responses:
        "404":
          description: >-
            路段不存在。判据同 /widths。
            ★ 与「该路段没有超高过渡数据」（200 + 空列表）是两回事。

  /v1/geometry/sections/{section_id}/stations:
    get:
      summary: 桩号序列（可按区间与是否整桩筛）
      responses:
        "404":
          description: >-
            路段不存在。判据同 /widths。
            ★ 与本路径的 **422 不同源**（该 422 见 v0.1）：422 是**参数**越界，
              与 section_id 无关，任何 id 都会这么回；404 才与 id 有关。
              参数校验先于函数体，故 `?limit=0` 配不存在的路段仍是 422。

  /v1/geometry/sections/{section_id}/alignment:
    get:
      summary: 平面线形：交点链 + 线形单元链（一次取回）
      responses:
        "404":
          description: >-
            路段不存在。判据同 /widths。
            ★ 与「该路段没有线形数据」（200 + 空的 pis / elements）是两回事。
              注意后者是**正常答案**（有的路段还没做数字化线形），不是错误。

  /v1/geometry/sections/{section_id}/elements:
    get:
      summary: 按桩号区间取线形单元（与区间**相交**的，供 Chrono / FEM）
      responses:
        "404":
          description: >-
            路段不存在。判据同 /widths。
            ★ 本路径有三种「不是 200」的成因，**互不相同**，不得混为一谈：
              · **422** —— `from_km > to_km`（区间反了）或参数缺 / 越界；
              · **404** —— 路段不存在；
              · **200 + 空列表** —— 路段存在、区间合法，但该区间内没有线元。
              三者在下游的修法分别是：改区间、改 id、找源文件。

  /v1/geometry/sections/{section_id}/samples:
    get:
      summary: 按桩号区间取某个逐桩段的行（供 Chrono / FEM）
      responses:
        "404":
          description: >-
            路段不存在。判据同 /widths。
            ★ 本路径的「不是 200」比 /elements 多一层，共**三种**：
              · **422** —— 区间反了 / 参数缺或越界 / **`segment` 是未知段名**
                （未知段名回 422 并列出可用值 —— 判据同下）；
              · **404** —— 路段不存在；
              · **200 + 空列表** —— 三者都合法，但该区间内没有数据。
              ⇒ 与 /elements 同理：三层各有各的修法，而**空列表只能表示第三层**。
