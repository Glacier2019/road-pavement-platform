# ============================================================================
# M6 统一数据出口 —— 几何查询参数取值的边界 v0.4
# ----------------------------------------------------------------------------
# 本文件是 m6-gateway.geo.v0.3.yaml 的**增量**，只描述本次补齐的三处边界。
# 真源仍是服务运行后自动生成的 /openapi.json；本文件是它的人工摘要。
#
# ★★★ 它为什么存在：**这三处边界实现一直在执行，契约一直没说。**
#
#   `m6-路由` 的 5j 门会把「契约与实现逐参数比形状」的结果打出来，
#   2026-10-14 实测那一行的口径是：
#
#     比了 25 个参数的形状 ｜ 类型/required 差 0 ｜ 范围两边都有而不同 0
#                         ｜ 实现有契约没声明 3 ｜ 契约声明了实现没有 0
#
#   那 3 条就是本文件要消掉的：
#     · `geo/reverse` 的 `lat`：实现 `-90 ≤ lat ≤ 90`
#     · `geo/reverse` 的 `lon`：实现 `-180 ≤ lon ≤ 180`
#     · `geo/route`  的 `step_m`：实现 `0 < step_m ≤ 1000`
#
# ★★ 为什么值得单独开一份增量，而不是「反正是限制，不写也没事」：
#   对接方照契约写代码，契约不说有边界，他就会以为任何数都能传。
#   传 `lat=91` 会收到 422，而他从契约里读不出为什么会 422。
#   **门是一直在执行的，只是没写在纸上** —— 这正是「契约许了一个实现给不出的
#   能力」的反面：**实现给得出一个契约没许的约束**。
#
# ★★ 为什么是新文件而不是就地改 v0.2 / v0.3：宪法 §I「契约禁止就地改」。
#   v0.2 与 v0.3 原样冻结，一个字都不许改。同目录
#   m6-gateway.geo.v0.3.yaml 立的（纠正 step_m 默认值也是新开一份增量）
#   就是这个先例。
#
# ★★★ 声明面是**多份契约的并集，按参数名整体替换、靠后的赢**。
#   所以本文件里每条被写到的参数都必须**写全**，不能只写新加的那半个键：
#
#     · `lat` / `lon`：v0.2 声明了 `required: true` —— 本文件**必须原样带上**。
#       漏掉它，合并时整条被替换，`required` 会变成 false，
#       5j 当场报「required 差」。（这不是推测：合并代码是
#       `slot[nm] = (…, bool(prm.get("required", False)))`，整条覆盖。）
#     · `step_m`：v0.3 声明了 `default: 20` —— 本文件同样必须带上。
#
# ★ 本文件的取值全部来自与**实现生成的 /openapi.json** 对读，不是转抄；
#   5j 每次跑都会把这里声明的每一个键与实现再比一遍。
# ============================================================================

openapi: 3.1.0
info:
  title: M6 统一数据出口（几何参数边界增量 v0.4）
  version: 0.4.0
  description: >-
    v0.3 之上的增量：给 `geo/reverse` 的 `lat`/`lon` 与 `geo/route` 的
    `step_m` 补上实现一直在执行的取值边界。
    向下兼容：**是** —— 这三条边界实现**本来就在执行**，本文件只是把它们
    写进声明。原先能通过的调用，现在照样通过；原先会 422 的调用，
    现在照样 422，只是**原因终于写在契约里了**。

paths:
  /v1/geometry/sections/{section_id}/geo/reverse:
    get:
      summary: 由经纬度反查桩号（坐标基准两级绑定）
      description: >-
        本次只**补上 `lat` / `lon` 的取值边界**。其余字段与 v0.2 一致，见那份文件。
        ★ `required: true` 是 v0.2 就有的，这里**原样保留**（见文件头的说明）。
      parameters:
        - name: section_id
          in: path
          required: true
          schema:
            type: integer
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
          description: >-
            纬度（度）。★ 边界**是本轮新写进契约的**：实现一直这样校验
            （超出回 422），只是 v0.2 只写了 `type: number`。
        - name: lon
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
          description: >-
            经度（度）。★ 边界同 `lat`，本轮新写进契约。

  /v1/geometry/sections/{section_id}/geo/route:
    get:
      summary: 路段线形按步长重采样
      description: >-
        本次只**补上 `step_m` 的取值边界**。其余字段与 v0.3 一致，见那份文件
        （包括 `step_m` 默认值为什么是 20 而不是 10 的那段实证记录）。
      parameters:
        - name: section_id
          in: path
          required: true
          schema:
            type: integer
        - name: step_m
          in: query
          schema:
            type: number
            default: 20
            exclusiveMinimum: 0
            maximum: 1000
          description: >-
            线元内的采样步长（米）。★ **默认值与取值原因见 m6-gateway.geo.v0.3.yaml**
            （该文件记了 2026-10-11 与 2026-10-14 两次实测：`step_m=20.0`、
            `point_count=337`）。
            ★ 边界（`0 < step_m ≤ 1000`）是本轮新写进契约的：
            实现一直这样校验，只是 v0.3 只写了 `default` 与 `type`。

# ============================================================================
# 本轮之后，5j 的「实现有契约没声明」应当为 **0**
# ----------------------------------------------------------------------------
# ★ 那意味着 `_UNDECLARED_FROZEN` 这份冻结名单**空掉** —— 而空掉是**目标**，
#   不是故障：债还完了，就没有东西要冻结。
#
# ★★ 但「名单为空」与「判据根本没在看」长得一模一样（宪法原则 V）。
#   所以这一轮同时把判据改成：
#     · 名单逐条按名字查（不是按条数）—— 空名单时，仍要求 `_undecl` 为空；
#     · 下界钉在**比对面够大**（`_s_pairs ≥ 20`），不钉「未声明不少于 N」，
#       因为那个数会随还债往下走，写死等于惩罚还债；
#     · 由**元测试**证明 `_shape` 仍能提取范围、仍能发现第三方向。
#   ⇒ 判据没哑掉这件事由「比对面下界 + 元测试」两条守，不再由「名单非空」守。
# ============================================================================
