# ============================================================================
# M6 统一数据出口 —— 响应码补遗 v0.1
# ----------------------------------------------------------------------------
# 本文件是既有契约的**增量**，只做一件事：补上**实现会回、契约没声明**的响应码。
# 真源仍是服务运行后自动生成的 /openapi.json；本文件是它的人工摘要。
#
# ★★★ 为什么会有这份文件（D-028 量出来的事实）
# ----------------------------------------------------------------------------
# 在这之前，**没有任何判据在核对响应码**。
#
#   5i / 5j 比的是「契约声明的**参数** ↔ 实现真收的参数」，三个方向全零。
#   5k  比的是「**表**有没有出口」。
#   两者都不看响应码。
#
# ⇒ 于是有一整类声明从来没被核对过。D-027 就是这么漏掉一个真缺陷的：
#   契约写着 404，实现回 400，28 项测试**全绿** ——
#   因为没有一项在问「契约说的码，实现真会回吗」。
#
# D-028 把 41 个「路径×响应码」声明与探针表**双向对读**，当场抓出两处不一致。
# 本文件修的是其中的**契约侧漏声明**：
#
#   GET /v1/geometry/sections/{section_id}/stations
#     契约（m6-gateway.v0.3.yaml:226）只声明了 200。
#     而 `limit` 带 `ge=1`、`from_km` / `to_km` 带 `ge=0`、`integer_only` 是布尔，
#     FastAPI 在**进函数体之前**就会把越界值挡掉，回 422。
#     现场实测：`/v1/geometry/sections/6/stations?limit=0` → **HTTP 422**。
#
#     ⇒ 客户端按契约写代码时，会把这个 422 当成**未定义行为**。
#       契约说「本接口只会回 200」，而它会回 422 —— 这是契约的错，不是实现的。
#
# ★ 为什么不在原文件上改：宪法 §I —— 契约**从不原地改**，
#   每一次修正都是新增量。原文件是历史冻结件，它记录的是**当时**的声明面。
#
# ★★ 为什么叫 responses 而不是 geo.v0.5：
#   本文件的主题不是「几何域的第 5 版」，而是**响应码完备性**。
#   将来别的路径再发现漏声明，补进这个文件即可 —— 主题可扩展。
#
# ★ 版本序（`((major, minor), 文件名)`）：本文件与 geo.v0.1、support.v0.1
#   同为 (0,1)，按文件名排在 geo.v0.1 与 support.v0.1 **之间**。
#
# ★ 声明面是**多份契约的并集**：本文件只**增加**响应码，不撤回任何既有声明。
#   （「撤回」需要另一套语义，本增量不涉及 —— 这是一条尚未覆盖的边界。）
# ============================================================================
openapi: 3.0.3
info:
  title: 路面性能数智化平台 — M6 统一数据出口（响应码补遗 v0.1）
  version: 0.1.0
  description: >-
    响应码补遗。只补实现会回、契约漏声明的码；不新增路径、不改参数面。

paths:
  /v1/geometry/sections/{section_id}/stations:
    get:
      summary: 桩号序列（可按区间与是否整桩筛）
      description: >-
        本增量**不动**本路径的参数声明（参数面见 m6-gateway.v0.3.yaml:226），
        只补上实现真的会回、而原文件没有声明的 **422**。
      responses:
        "422":
          description: >-
            查询参数越界或类型不符。由 FastAPI 在**进函数体之前**挡掉 ——
            因此它与「路段存不存在」无关，**任何** section_id 都会这样回。
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail:
                    type: array
                    description: 逐项列出被拒的参数。
                    items:
                      type: object
                      required: [type, loc, msg]
                      properties:
                        type:
                          type: string
                          description: 校验器名字，如 `greater_than_equal`、`missing`。
                        loc:
                          type: array
                          description: 出错位置，如 `["query", "limit"]`。
                          items:
                            type: string
                        msg:
                          type: string
                          description: 人可读的判词，如 `Input should be greater than or equal to 1`。
                        input:
                          description: 触发拒绝的原始输入值。
                          nullable: true
          # ★ 越界的典型触发条件（原文件的参数声明里已经写着这些边界，
          #   但**没有把边界与它的后果连起来**）：
          #     limit=0            → ge=1 被破
          #     limit=1001         → le=1000 被破
          #     from_km=-1         → ge=0 被破
          #     integer_only=maybe → 布尔解析失败
