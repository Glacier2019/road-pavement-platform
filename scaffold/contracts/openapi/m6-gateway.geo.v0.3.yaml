# ============================================================================
# M6 统一数据出口 —— 坐标基准两级绑定契约 v0.3
# ----------------------------------------------------------------------------
# 本文件是 m6-gateway.geo.v0.2.yaml 的**增量**，只描述本次纠正的那一处。
# 真源仍是服务运行后自动生成的 /openapi.json；本文件是它的人工摘要。
#
# ★★★ 它为什么存在：**一个从 004 第一天就漂着、七年没人看见的默认值。**
#
#   `/geo/route` 的 `step_m`：
#     · v0.1（004 的 plan，2026-09-xx 写）声明  default: 10
#     · 实现（e052105，004 MVP）       写成     Query(20.0, ...)
#   ⇒ 契约先写、实现后做，两边从第一天就不一致。
#
#   而这个不一致**不报错**：不传 `step_m` 的调用方，
#   照契约以为拿到 10 米间距的折线，实际拿到 20 米。
#   `point_count` 也差一倍（10 米 ≈ 670 点，20 米 = 337 点）。
#
#   ★ 直到 2026-10-14 才有东西比这两个数 —— `m6-路由` 第 5i 条
#     （契约声明的查询参数与默认值 == 实现认识的）。它第一次跑就抓到了这里。
#
# ★★ 为什么改的是**声明**而不是实现：20 是**已上线的事实**。
#    004 的验收记录（specs/004-region-frame/quickstart.md 第 249 行）逐字写着
#    「2026-10-11 实测（step_m=20，点总数 337）」；2026-10-14 再测一次，
#    仍是 step_m=20.0、point_count=337。
#    改一个上线两年的默认值是**破坏性变更**，改一句写错的声明不是。
#    ⇒ 声明向事实靠拢。（若将来判定 10 才是想要的密度，那是**另一次变更**：
#      要改实现、要重跑落点判据，不是在契约里改一个数字。）
#
# ★★ 为什么是新文件而不是就地改 v0.1：宪法 §I「契约禁止就地改」。
#    v0.1 原样冻结，一个字都不许改 —— 下游照着它写过的解析代码必须继续成立。
#
# ★ 本文件的字段名与默认值全部来自**与服务对读**，不是转抄：
#    `m6-路由` 的 5i 每次跑都会把契约与实现逐个参数比一遍。
# ============================================================================

openapi: 3.0.3
info:
  title: M6 统一数据出口（geo 增量 v0.3）
  version: 0.3.0
  description: >-
    v0.2 之上的增量，只有一处：`/geo/route` 的 `step_m` 默认值，
    由 v0.1 声明的 10 纠正为实现的 20。
    向下兼容：**是** —— 服务端行为一个字没变，变的只是这份摘要写对了。

paths:
  /v1/geometry/sections/{section_id}/geo/route:
    get:
      summary: 整条路线的点列（含包围盒）
      description: >-
        本条目只**补正一个默认值**，其余字段（响应形状、其余参数）
        与 v0.1 / v0.2 一致，见那两份文件。
      parameters:
        - name: step_m
          in: query
          schema:
            type: number
            default: 20
          description: >-
            线元内的采样步长（米）。采样是**逐个线元**做的，不是「从 0 开始每
            step_m 一个」—— 后者的样点密度与曲率无关，而「曲线是弯的」这条
            判据恰恰要看曲率大处的折线够不够密。

            ★ 默认值是 **20**，不是 v0.1 写过的 10。实测口径：
            2026-10-11 与 2026-10-14 两次测量都得到 `step_m=20.0`、
            `point_count=337`（该路段 5805 m）。
