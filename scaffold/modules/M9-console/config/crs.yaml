# M9 平台管理台 —— 坐标基准配置
#
# ★ 为什么这份配置存在，而局部帧并不需要它
# ---------------------------------------------------------------
# 「局部帧」用的是设计坐标系（X=北, Y=东, Z=上, 米），与大地基准无关。
# 这条路本身的三维起伏、仿真轨迹、沿程量着色，全都不需要带号。
#
# 那这份文件是给谁的？给**区域帧**（全省/区域路网、病害空间分布、
# 养护巡检时序、地形影像底图）。那五件事都要把桩号变成经纬度，
# 而带号一旦错了，位置误差是**几百公里** —— 且在任何一个局部视图里
# 都看不出来。它只在把模型放到地球上那一刻暴露。
#
# 所以这个值必须有一个**带标记的位置**，而不是散落在某天的对话记录里。
# 把一个尚未确认的值写进配置并标注，比把它写进代码并假装确定要安全。
#
# ★ 本文件当前**不参与任何几何计算**。M9 的 /sim 页面只读它来显示
# 「当前基准 + 这是推断值」。区域帧就绪前，它是一份声明。

version: "0.1"

# 局部帧：本 feature（003-local-terrain-viewer）实际使用的帧
local_frame:
  axes: "X=北, Y=东, Z=上"
  unit: m
  note: >
    设计坐标系。与大地基准无关，因此不需要带号。
    路面高程来自 CRG 实测地形高程（0.1 m 网格），不是中线控制点 z
    —— 后者比实际路面高约 200 mm 且没有路拱。

# 地理帧：区域帧（尚未实现）将使用的帧
geographic_frame:
  # ★ 区域帧能否使用。当前 false —— 因为下面的带号是推断值，未经设计人确认。
  ready: false

  ellipsoid: CGCS2000
  projection: 高斯-克吕格
  zone_width_deg: 3
  zone_number: 39
  central_meridian_deg: 117

  # ★★ 与 ready 是**两个不同的标记**，不能合并：
  #    ready  说「能不能用」
  #    assumed 说「值可不可信」
  #    把 ready 设成 true 而 assumed 仍是 true 是合法状态 ——
  #    那是「先用着，但我知道它是猜的」。
  assumed: true

  # 推断依据。与值一同记录，使接手者能复核，也能推翻。
  evidence:
    - "Y 值无带号前缀：实测 534559.2..537679.4 m。若带前缀应约 39534559..39537679"
    - "Y 距 500 km 假东偏 +34.6..+37.7 km，即距中央子午线 34.6..37.7 km"
    - "39 带（117°E）落点为 25.08°N / 117.34°E —— 闽中山区，吻合"
    - "40 带（120°E）落点为 25.08°N / 120.34°E —— 台湾海峡，约 150 km 离岸，排除"
    - "投影长度变形 14.75..17.51 mm/km，满足《公路工程数字勘察通用规范》25 mm/km 上限"
    - "地形特征：8 段 255..500 m 半径圆曲线 + 29.75 m 高差 —— 山岭重丘区，与闽中吻合"
    # ★ 下面这条记录的是一次**平台侧复核**，不是设计方确认。
    #   它只说明「我们又独立看了一遍，结论不变」，所以 assumed 仍是 true。
    #   不要让这条的存在被读成「已经确认过了」—— 那就把两个标记又合并回去了。
    - "2026-10-10 平台侧复核：用户确认沿用 39 带，assumed 保持 true（复核 ≠ 设计方确认）"

  # ★ 这条也记下**为什么局部帧不需要地理帧**：
  #    局部帧的坐标是 (X=北, Y=东, Z=上) 的米制平面帧，与带号无关。
  #    底图只对区域帧有意义，而区域帧依赖带号。所以两者互不阻塞。

  # 一条能把这个推断变成确认的低成本路径
  confirm_path: >
    .PRJ 文件的可读载荷含 lql730@outlook.com。一封邮件即可把
    assumed 从 true 变成 false。不阻塞任何当前工作。

  # ★ 换带号时只改上面四个字段（zone_number / central_meridian_deg /
  #   下面这一行 EPSG）。换完必须重跑区域帧的落点检查 ——
  #   错带号的特征是「纬度不变、经度整体平移一个带宽（约 300 km）」，
  #   所以一个只打印经纬度的检查就能发现它。
  epsg_after_confirm: null
  note: >
    确认后填 EPSG（3 度带 39 带 / CGCS2000 对应 EPSG:4547 一类的带号编码，
    以 PostGIS spatial_ref_sys 为准，不凭记忆填）。
    换基准时 spatial_ref_sys 里已有 8500 行，PostGIS 就位，
    所以替换是**一条 UPDATE**，不是重算。
