# ============================================================================
# 路面性能数智化平台 · 骨架栈（Walking Skeleton）
# ----------------------------------------------------------------------------
# 目标：让「一条 WIM 过车报文」穿过 6 个容器跑通全链——这是所有模块的接入基线，
#       之后每个模块都是往这条链上"长"，而不是各自为战最后集成不上。
#
#   模拟器 → EMQX(MQTT) → ingest(M2) → PostgreSQL 分区表 → api(M6) → Grafana
#
# 端口刻意避让本机已占用端口（5432 / 8000 / 3000 / 8080 已被其它服务占用）；
# 若你的机器空闲，直接改 .env 即可。
#
# 用法：
#   cd scaffold
#   cp .env.example .env && vi .env          # 只需填两个密码
#   docker compose -f docker-compose.skeleton.yml --env-file .env up -d --build
#   docker compose -f docker-compose.skeleton.yml ps
#   → 详见 README.md「第一步怎么走」
# ============================================================================
name: rp-skeleton

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------------- 关系库（M1）
  pg:
    image: postgis/postgis:16-3.4
    container_name: rp-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-rp}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 .env 里设置 PG_PASSWORD}
      POSTGRES_DB: ${PG_DB:-road_pavement}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "${PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化按文件名顺序执行（已存在的数据卷不会重复执行）：
      #   10 → 契约② 真源 DDL（就在 ./sql/ 下：与代码同仓，不复制、不会漂移）
      #   20 → 按月分区脚本（wim_axle_record）
      #   90 → 骨架种子数据（路线/路段/断面/设备/通道/字典）
      - ./sql/10_ddl_v0.4.sql:/docker-entrypoint-initdb.d/10_ddl_v0.4.sql:ro
      - ./sql/20_partitions.sql:/docker-entrypoint-initdb.d/20_partitions.sql:ro
      - ./sql/90_seed_skeleton.sql:/docker-entrypoint-initdb.d/90_seed_skeleton.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-rp} -d ${PG_DB:-road_pavement}"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging

  # ------------------------------------------------------------ 接入 Broker（M2）
  mqtt:
    image: emqx/emqx:5.8
    container_name: rp-mqtt
    restart: unless-stopped
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_PASSWORD:-public}
      TZ: Asia/Shanghai
    ports:
      - "${MQTT_PORT:-18883}:1883"             # MQTT 接入
      - "${MQTT_DASHBOARD_PORT:-18083}:18083"  # EMQX 控制台（admin/public）
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *default-logging

  # ------------------------------------------------------------ 对象存储（M1）
  minio:
    # 必须钉住 RELEASE tag，不能写 latest：minio/minio:latest 已不可拉取
    # （2026-09 实测 6 次全部超时；同机 alpine/其它镜像均可拉，minio 的 RELEASE tag
    #  也可拉 —— 即 latest 这个浮动 tag 已失效），而 compose 只要有一个镜像拉不到，
    # `docker compose up -d` 就会整体失败。RELEASE tag 同时满足可复现要求。
    # ⚠ 上游已于 2025-10 归档社区版、停发 Docker Hub 免费镜像，且较新版本存在
    #   CVE-2025-62506；正式环境请改为自建镜像或换 SeaweedFS/RustFS 等仍在维护的
    #   S3 兼容实现（本骨架栈的 LO 竖切不依赖对象存储，可先不启该服务）。
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: rp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-rpadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?请在 .env 里设置 MINIO_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # -------------------------------------------------------------- 监控（M1/M9）
  grafana:
    # 版本选择有依据，不要随手改回 11.x：
    #   界面中文化取决于 Grafana 自带 zh-Hans 语言包的覆盖面，实测两版差距极大——
    #     11.3.0  →  96 个命名空间 / 1,676 条中文
    #     13.2.1  → 215 个命名空间 / 10,935 条中文（6.5 倍）
    #   11.3 下首页与主界面大半仍是英文，13.2.1 下已是「首页/仪表板/警报/连接/管理/
    #   刷新/分享…」这样的完整中文。代价：镜像 485 MB → 1.39 GB。
    #   实测升级后 provisioning（数据源 + 面板）与查询全部照常，无需改配置。
    image: grafana/grafana:13.2.1
    container_name: rp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      # ⚠ 这一项**只在 Grafana 首次初始化建库时生效**。本服务用了持久卷
      #   （grafanadata），若卷是更早留下的、或日后改了这里的口令，都不会覆盖库里
      #   已有的口令 —— 现象是「env 明明是 admin，却怎么都登不进去」。
      #   处置（不必删卷、不影响已配好的数据源与面板）：
      #       docker exec rp-grafana grafana cli admin reset-admin-password <新口令>
      #       docker compose ... restart grafana      # ← 必须重启！运行中的进程会缓存旧口令哈希
      #   ⚠ 排查时不要用 curl 反复重试，会触发 Grafana 的连续失败锁定（5 分钟滑窗），
      #     重置成功后仍被旧锁定挡住，极易误判成「重置没生效」。
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 界面中文化：Grafana 自带 zh-Hans 语言包，设这一项即可，不需要装任何插件。
      # （面板标题本来就是中文，这里管的是 Grafana 自身的菜单/按钮/设置页等 UI 文案。）
      GF_USERS_DEFAULT_LANGUAGE: zh-Hans
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Shanghai
      PG_PASSWORD: ${PG_PASSWORD}          # 供 provisioning 数据源插值
      TZ: Asia/Shanghai
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      # 数据源/面板以代码方式提供（provisioning），不靠手工点选
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *default-logging

  # ------------------------------------------------------- 接入服务（M2，竖切 3）
  ingest:
    # 契约③写入收口后，M2 依赖 M3（modules/M3-rpdao），故构建上下文抬到 scaffold 根，
    # 否则 Dockerfile 里 COPY modules/M3-rpdao 会越出上下文而失败（与 api 同理）。
    build:
      context: .
      dockerfile: modules/M2-ingest/Dockerfile
    container_name: rp-ingest
    restart: unless-stopped
    environment:
      PG_DSN: postgresql://${PG_USER:-rp}:${PG_PASSWORD}@pg:5432/${PG_DB:-road_pavement}
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC: ${INGEST_TOPIC:-g228/+/+/axle}
      BATCH_NO_PREFIX: skeleton
      LOG_LEVEL: INFO
      TZ: Asia/Shanghai
    ports:
      - "${INGEST_PORT:-8010}:8000"   # /healthz /metrics /docs
    depends_on:
      pg:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    # ingest/api/grafana 原先都没有 healthcheck：DoD 第 1 条要求 `ps` 全为 healthy，
    # 而没定义 healthcheck 的服务只会显示 Up，永远到不了 healthy —— 该条按字面无法达成。
    # 已按各容器内实测可用的工具补齐（均为实跑验证过才写进来的）。
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging

  # --------------------------------------------------------- API 服务（M6，竖切 5）
  api:
    # M3（modules/M3-rpdao）是 api 的依赖，故构建上下文必须抬到 scaffold 根，
    # 否则 Dockerfile 里 COPY modules/M3-rpdao 会越出上下文而失败。
    build:
      context: .
      dockerfile: modules/M6-api/Dockerfile
    container_name: rp-api
    restart: unless-stopped
    environment:
      PG_DSN: postgresql://${PG_USER:-rp}:${PG_PASSWORD}@pg:5432/${PG_DB:-road_pavement}
      LOG_LEVEL: INFO
      TZ: Asia/Shanghai
    ports:
      - "${API_PORT:-8001}:8000"      # /openapi.json 即平台服务契约
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging

  # ==========================================================================
  # 以下 6 个服务是**模块骨架**（M4/M5/M7/M8/M9/M10），业务逻辑待各组实现。
  #
  # 为什么用 profiles：这 6 个骨架如果默认启动，会污染"6 服务全 healthy"这条
  # 已验证的基线（而且骨架的 /healthz 在依赖未就位时会如实返回 degraded）。
  # 用 profile 后：
  #     docker compose -f docker-compose.skeleton.yml up -d            # 仍是原来的 6 服务
  #     docker compose -f docker-compose.skeleton.yml --profile m4 up -d   # 只多起 M4
  # 各组开发自己模块时只启自己的 profile，互不干扰——这就是"可拔插"。
  # ==========================================================================

  governance:                       # M4 数据治理 · 真数据门  ← P1 关键路径
    build: ./modules/M4-governance
    container_name: rp-governance
    profiles: ["m4"]
    restart: unless-stopped
    environment:
      PG_DSN: postgresql://${PG_USER:-rp}:${PG_PASSWORD}@pg:5432/${PG_DB:-road_pavement}
      QUALITY_RULES_PATH: config/quality_rules.yaml
      LOG_LEVEL: INFO
      TZ: Asia/Shanghai
    ports:
      - "${GOVERNANCE_PORT:-8020}:8000"
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging

  fusion:                           # M5 融合辨析引擎  ← 门禁：等 M4
    build: ./modules/M5-fusion
    container_name: rp-fusion
    profiles: ["m5"]
    restart: unless-stopped
    environment:
      PG_DSN: postgresql://${PG_USER:-rp}:${PG_PASSWORD}@pg:5432/${PG_DB:-road_pavement}
      LOG_LEVEL: INFO
      TZ: Asia/Shanghai
    ports:
      - "${FUSION_PORT:-8021}:8000"
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging

  semantic:                         # M7 语义中枢  ← 责任人待指派
    build: ./modules/M7-semantic
    container_name: rp-semantic
    profiles: ["m7"]
    restart: unless-stopped
    environment:
      PG_DSN: postgresql://${PG_USER:-rp}:${PG_PASSWORD}@pg:5432/${PG_DB:-road_pavement}
      LOG_LEVEL: INFO
      TZ: Asia/Shanghai
    ports:
      - "${SEMANTIC_PORT:-8022}:8000"
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging

  apps:                             # M8 应用层（4 条容器化条目先合一）
    build: ./modules/M8-apps
    container_name: rp-apps
    profiles: ["m8"]
    restart: unless-stopped
    environment:
      PG_DSN: postgresql://${PG_USER:-rp}:${PG_PASSWORD}@pg:5432/${PG_DB:-road_pavement}
      LOG_LEVEL: INFO
      TZ: Asia/Shanghai
    ports:
      - "${APPS_PORT:-8023}:8000"
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging

  console:                          # M9 平台管理台（集成面）
    build: ./modules/M9-console
    container_name: rp-console
    profiles: ["m9"]
    restart: unless-stopped
    environment:
      MODULE_REGISTRY: config/modules.yaml
      PROBE_TIMEOUT_S: "3"
      # 几何浏览页经此地址转发到 M6（容器内服务名与端口，不是宿主映射端口 8001）
      GATEWAY_BASE: http://api:8000
      GATEWAY_TIMEOUT_S: "10"
      LOG_LEVEL: INFO
      TZ: Asia/Shanghai
    ports:
      - "${CONSOLE_PORT:-8024}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging

  agent:                            # M10 Agent 执行引擎（二期，本阶段不排期）
    build: ./modules/M10-agent
    container_name: rp-agent
    profiles: ["m10"]
    restart: unless-stopped
    environment:
      M6_BASE_URL: http://api:8000
      LOG_LEVEL: INFO
      TZ: Asia/Shanghai
    ports:
      - "${AGENT_PORT:-8025}:8000"
    logging: *default-logging


volumes:
  pgdata:
  miniodata:
  grafanadata:
